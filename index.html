<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7">

<title>31 Day Tracker</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#f2f2f7;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif;
  -webkit-font-smoothing:antialiased;
}

.app{
  max-width:520px;
  margin:auto;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom));
}

/* HEADER */

.header{
  padding:10px 5px 18px;
}

h1{
  margin:0;
  font-size:34px;
  line-height:1.05;
  letter-spacing:-1.4px;
  font-weight:750;
}

.sub{
  margin:7px 0 0;
  color:#8a8a8f;
  font-size:15px;
}

/* PROGRESS CARD */

.progress-card{
  background:#111;
  color:white;
  border-radius:24px;
  padding:21px;
  margin-bottom:14px;
  box-shadow:0 5px 18px rgba(0,0,0,.12);
}

.progress-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.progress-title{
  font-size:13px;
  font-weight:600;
  opacity:.65;
  letter-spacing:.3px;
}

.percent{
  font-size:14px;
  font-weight:700;
}

.progress-number{
  font-size:48px;
  line-height:1;
  font-weight:750;
  letter-spacing:-2px;
  margin:10px 0 15px;
}

.progress-bar{
  height:9px;
  background:#3b3b3d;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  height:100%;
  width:0%;
  background:white;
  border-radius:20px;
  transition:width .25s ease;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-bottom:14px;
}

.stat{
  background:white;
  border-radius:18px;
  padding:14px 7px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:19px;
  font-weight:700;
  letter-spacing:-.4px;
}

.stat span{
  display:block;
  color:#8a8a8f;
  font-size:10px;
  font-weight:650;
  margin-top:4px;
  letter-spacing:.4px;
}

/* DAYS */

.days-card{
  background:white;
  border-radius:22px;
  padding:12px;
}

.section-title{
  font-size:18px;
  font-weight:700;
  padding:7px 7px 12px;
  letter-spacing:-.3px;
}

.day-row{
  display:grid;
  grid-template-columns:42px minmax(0,1fr) 58px 44px 44px;
  align-items:center;
  min-height:68px;
  border-top:1px solid #eee;
  gap:6px;
}

/* DAY NUMBER */

.day-number{
  width:36px;
  height:36px;
  border-radius:11px;
  background:#f2f2f7;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  font-weight:700;
  color:#555;
}

.day-row.complete .day-number{
  background:#111;
  color:white;
}

.day-name{
  font-size:15px;
  font-weight:650;
}

.day-status{
  font-size:11px;
  color:#999;
  margin-top:2px;
}

.day-row.complete .day-status{
  color:#111;
}

/* SCORE */

.score{
  width:52px;
  height:36px;
  border:0;
  outline:0;
  border-radius:11px;
  background:#f2f2f7;
  text-align:center;
  font-family:inherit;
  font-size:15px;
  font-weight:700;
  color:#111;
}

.score:focus{
  background:#e5e5ea;
}

/* T / W */

.check-label{
  display:flex;
  justify-content:center;
  align-items:center;
}

.check-label input{
  appearance:none;
  -webkit-appearance:none;
  width:27px;
  height:27px;
  border:2px solid #c7c7cc;
  border-radius:9px;
  background:white;
  margin:0;
  position:relative;
  transition:.15s ease;
}

.check-label input:checked{
  background:#111;
  border-color:#111;
}

.check-label input:checked:after{
  content:"✓";
  color:white;
  position:absolute;
  left:4px;
  top:-1px;
  font-size:17px;
  font-weight:700;
}

/* COLUMN LABELS */

.column-head{
  display:grid;
  grid-template-columns:42px minmax(0,1fr) 58px 44px 44px;
  gap:6px;
  padding:0 0 7px;
  color:#999;
  font-size:9px;
  font-weight:700;
  letter-spacing:.5px;
  text-align:center;
}

.column-head div:nth-child(2){
  text-align:left;
}

.column-head div:nth-child(3){
  text-align:center;
}

/* RESET */

.reset-card{
  margin-top:14px;
  background:white;
  border-radius:18px;
  padding:13px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.reset-card b{
  font-size:15px;
}

button{
  border:0;
  background:#111;
  color:white;
  border-radius:11px;
  padding:10px 15px;
  font-family:inherit;
  font-size:14px;
  font-weight:650;
}

button:active{
  transform:scale(.96);
  opacity:.8;
}

/* NOTE */

.note{
  color:#999;
  font-size:11px;
  line-height:16px;
  padding:11px 6px 3px;
}

/* SMALL IPHONES */

@media(max-width:380px){

  .app{
    padding-left:10px;
    padding-right:10px;
  }

  .progress-card{
    padding:18px;
  }

  .progress-number{
    font-size:43px;
  }

  .day-row{
    grid-template-columns:38px minmax(0,1fr) 52px 40px 40px;
  }

  .column-head{
    grid-template-columns:38px minmax(0,1fr) 52px 40px 40px;
  }

  .score{
    width:48px;
  }

  .day-name{
    font-size:14px;
  }
}
</style>
</head>

<body>

<main class="app">

  <div class="header">
    <h1>31 Day Tracker</h1>
    <p class="sub">Lock in. One day at a time.</p>
  </div>

  <!-- PROGRESS -->

  <div class="progress-card">

    <div class="progress-top">
      <div class="progress-title">OVERALL PROGRESS</div>
      <div class="percent" id="percent">0%</div>
    </div>

    <div class="progress-number" id="progressNumber">
      0 / 31
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

  </div>

  <!-- STATS -->

  <div class="stats">

    <div class="stat">
      <b id="s">0/155</b>
      <span>SCORE</span>
    </div>

    <div class="stat">
      <b id="t">0/31</b>
      <span>T</span>
    </div>

    <div class="stat">
      <b id="w">0/31</b>
      <span>W</span>
    </div>

  </div>

  <!-- DAYS -->

  <div class="days-card">

    <div class="section-title">
      Daily Progress
    </div>

    <div class="column-head">
      <div></div>
      <div>DAY</div>
      <div>SCORE</div>
      <div>T</div>
      <div>W</div>
    </div>

    <div id="rows"></div>

    <div class="note">
      Tap the day box to complete a day. Score each day from 0–5. T and W can be checked independently. Everything saves automatically.
    </div>

  </div>

  <!-- RESET -->

  <div class="reset-card">
    <b>Reset tracker</b>
    <button onclick="resetAll()">Reset</button>
  </div>

</main>

<script>

const K='tracker31';

let x=JSON.parse(localStorage.getItem(K)||'null')
  ||Array.from({length:31},()=>({d:0,s:0,t:0,w:0}));

/* Keep old saved trackers compatible */

x.forEach(a=>{
  if(a.w===undefined)a.w=0;
});

const r=document.getElementById('rows');

function save(){
  localStorage.setItem(K,JSON.stringify(x));
  stats();
}

function stats(){

  const completed=x.filter(a=>a.d).length;

  const totalScore=x.reduce((q,a)=>q+a.s,0);

  const totalT=x.filter(a=>a.t).length;

  const totalW=x.filter(a=>a.w).length;

  const percentage=Math.round((completed/31)*100);

  document.getElementById('progressNumber').textContent=
    completed+' / 31';

  document.getElementById('percent').textContent=
    percentage+'%';

  document.getElementById('progressFill').style.width=
    percentage+'%';

  document.getElementById('s').textContent=
    totalScore+'/155';

  document.getElementById('t').textContent=
    totalT+'/31';

  document.getElementById('w').textContent=
    totalW+'/31';
}

function render(){

  r.innerHTML='';

  x.forEach((a,i)=>{

    const z=document.createElement('div');

    z.className='day-row'+(a.d?' complete':'');

    z.innerHTML=

      '<div class="check-label">'+
        '<input type="checkbox" '+(a.d?'checked':'')+'>'+
      '</div>'+

      '<div>'+
        '<div class="day-name">Day '+(i+1)+'</div>'+
        '<div class="day-status">'+
          (a.d?'Completed':'Not completed')+
        '</div>'+
      '</div>'+

      '<input class="score" type="number" min="0" max="5" value="'+a.s+'">'+

      '<label class="check-label">'+
        '<input type="checkbox" '+(a.t?'checked':'')+'>'+
      '</label>'+

      '<label class="check-label">'+
        '<input type="checkbox" '+(a.w?'checked':'')+'>'+
      '</label>';

    /* DAY */

    z.children[0].children[0].onchange=e=>{
      a.d=e.target.checked?1:0;
      save();
      render();
    };

    /* SCORE */

    z.children[2].onchange=e=>{

      a.s=Math.max(
        0,
        Math.min(5,parseInt(e.target.value)||0)
      );

      e.target.value=a.s;

      save();
    };

    /* T */

    z.children[3].children[0].onchange=e=>{
      a.t=e.target.checked?1:0;
      save();
    };

    /* W */

    z.children[4].children[0].onchange=e=>{
      a.w=e.target.checked?1:0;
      save();
    };

    r.appendChild(z);

  });

  stats();
}

function resetAll(){

  if(confirm('Reset all 31 days?')){

    x=Array.from(
      {length:31},
      ()=>({d:0,s:0,t:0,w:0})
    );

    save();
    render();
  }
}

render();

</script>

</body>
</html>
