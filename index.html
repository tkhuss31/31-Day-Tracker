<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>31 Day Tracker</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f2f2f7;margin:0;color:#111}.app{max-width:520px;margin:auto;padding:20px 14px 40px}h1{margin:5px 4px}.sub{color:#777;margin:4px 4px 18px}.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:14px}.stats{display:flex;gap:8px}.stat{flex:1;text-align:center;background:#f2f2f7;border-radius:12px;padding:10px}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:#777}.head,.row{display:grid;grid-template-columns:1fr 70px 32px 32px;align-items:center}.head{font-size:11px;color:#777;padding:0 7px 7px}.row{min-height:52px;border-top:1px solid #eee;padding:4px 7px}.day{display:flex;align-items:center;gap:8px;font-weight:600}input[type=checkbox]{appearance:none;width:25px;height:25px;border:2px solid #aaa;border-radius:7px;background:#fff;margin:0;position:relative}input[type=checkbox]:checked{background:#111;border-color:#111}input[type=checkbox]:checked:after{content:"✓";color:#fff;position:absolute;left:4px;top:-1px;font-weight:bold;font-size:17px}.score{width:58px;height:34px;justify-self:center;border:0;border-radius:10px;background:#f2f2f7;text-align:center;font-size:15px;font-weight:600}.t,.w{justify-self:center}button{border:0;background:#111;color:#fff;border-radius:11px;padding:10px 14px;font-weight:600}.actions{display:flex;justify-content:space-between;align-items:center}.note{font-size:12px;color:#777;margin-top:10px}
</style></head><body><main class="app"><h1>31 Day Tracker</h1><p class="sub">Lock in. One day at a time.</p>
<div class="card"><div class="stats"><div class="stat"><b id="d">0/31</b><span>DAYS</span></div><div class="stat"><b id="s">0/155</b><span>SCORE</span></div><div class="stat"><b id="t">0/31</b><span>T</span></div><div class="stat"><b id="w">0/31</b><span>W</span></div></div></div>
<div class="card"><div class="head"><div>DAY</div><div style="text-align:center">SCORE</div><div style="text-align:center">T</div><div style="text-align:center">W</div></div><div id="rows"></div><div class="note">Tap either box. Tap a score to change it from 0–5. Progress saves automatically.</div></div>
<div class="card actions"><b>Reset tracker</b><button onclick="resetAll()">Reset</button></div></main>
<script>
const K='tracker31';let x=JSON.parse(localStorage.getItem(K)||'null')||Array.from({length:31},()=>({d:0,s:0,t:0,w:0}));

x.forEach(a=>{if(a.w===undefined)a.w=0});

let r=document.getElementById('rows');

function save(){localStorage.setItem(K,JSON.stringify(x));stats()}

function stats(){
d.textContent=x.filter(a=>a.d).length+'/31';
s.textContent=x.reduce((q,a)=>q+a.s,0)+'/155';
t.textContent=x.filter(a=>a.t).length+'/31';
w.textContent=x.filter(a=>a.w).length+'/31'
}

function render(){
r.innerHTML='';
x.forEach((a,i)=>{
let z=document.createElement('div');
z.className='row';
z.innerHTML='<label class="day"><input type="checkbox" '+(a.d?'checked':'')+'><span>Day '+(i+1)+'</span></label><input class="score" type="number" min="0" max="5" value="'+a.s+'"><input class="t" type="checkbox" '+(a.t?'checked':'')+'><input class="w" type="checkbox" '+(a.w?'checked':'')+'>';

z.children[0].children[0].onchange=e=>{a.d=e.target.checked?1:0;save()};
z.children[1].onchange=e=>{a.s=Math.max(0,Math.min(5,parseInt(e.target.value)||0));e.target.value=a.s;save()};
z.children[2].onchange=e=>{a.t=e.target.checked?1:0;save()};
z.children[3].onchange=e=>{a.w=e.target.checked?1:0;save()};

r.appendChild(z)
});
stats()
}

function resetAll(){
if(confirm('Reset all 31 days?')){
x=Array.from({length:31},()=>({d:0,s:0,t:0,w:0}));
save();
render()
}
}

render();
</script></body></html>
